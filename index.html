<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Simple Calculator</h1>
    </header>
    <div class="container">
      <div class="display">
        <div class="input-value" id="input-value">00</div>
        <div class="output" id="output"></div>
      </div>
      <div class="main">
        <div class="buttons">
          <div class="function top clear" id="clear">AC</div>
          <div class="function top" id="delete">X</div>
          <div class="function top" id="subtract">-</div>
          <div class="function top" id="multiply">*</div>
          <div class="function right" id="divide">/</div>
          <div class="function right" id="add">+</div>
          <div class="function right" id="equals">=</div>
        </div>
        <div class="number-container">
          <div class="number" id="1">1</div>
          <div class="number" id="2">2</div>
          <div class="number" id="3">3</div>
          <div class="number" id="4">4</div>
          <div class="number" id="5">5</div>
          <div class="number" id="6">6</div>
          <div class="number" id="7">7</div>
          <div class="number" id="8">8</div>
          <div class="number" id="9">9</div>
          <div class=""></div>
          <div class="number" id="0">0</div>
          <div class="number" id="decimal">.</div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
